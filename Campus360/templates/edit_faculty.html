<!DOCTYPE html>
<html>

<head>

<title>Edit Faculty</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main">

<div class="form-box">

<h2>Edit Faculty</h2>

<form action="/edit_faculty/{{ faculty['facultyid'] }}" method="POST">

<input
type="text"
name="name"
value="{{ faculty['name'] }}"
placeholder="Faculty Name"
required>

<input
type="text"
name="department"
value="{{ faculty['department'] }}"
placeholder="Department"
required>

<input
type="text"
name="phone"
value="{{ faculty['phone'] }}"
placeholder="Phone Number">

<input
type="email"
name="email"
value="{{ faculty['email'] }}"
placeholder="Email">

<br><br>

<button
type="submit"
class="btn btn-success">

Update Faculty

</button>

<a
href="/view_faculty/{{ faculty['facultyid'] }}"
class="btn">

Cancel

</a>

</form>

</div>

</div>

</body>

</html>
