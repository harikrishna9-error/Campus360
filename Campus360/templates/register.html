<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h2>Student Registration</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}

{% for message in messages %}

<div class="success-message">
{{ message }}
</div>

{% endfor %}

{% endif %}
{% endwith %}

<form action="/register" method="POST">

<input type="text"
name="rollno"
placeholder="Roll Number"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<input type="text"
name="name"
placeholder="Full Name"
required>

<input type="text"
name="branch"
placeholder="Branch"
required>

<input type="text"
name="year"
placeholder="Year"
required>

<input type="text"
name="section"
placeholder="Section"
required>

<input type="text"
name="phone"
placeholder="Phone">

<input type="email"
name="email"
placeholder="Email">

<button
type="submit"
class="login-btn">

Register

</button>

</form>

</div>

</div>

</body>

</html>
