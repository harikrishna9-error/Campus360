<!DOCTYPE html>
<html>

<head>

<title>Add Faculty</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main">

<div class="form-box">

<h2>Add Faculty</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}

<div class="alert alert-{{ category }}">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form action="/add_faculty" method="POST">

<input
type="text"
name="facultyid"
placeholder="Faculty ID"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<input
type="text"
name="name"
placeholder="Faculty Name"
required>

<input
type="text"
name="department"
placeholder="Department"
required>

<input
type="text"
name="phone"
placeholder="Phone Number">

<input
type="email"
name="email"
placeholder="Email">

<br><br>

<button
type="submit"
class="btn btn-success">

Add Faculty

</button>

</form>

</div>

</div>

</body>

</html>
