<!DOCTYPE html>
<html>

<head>

<title>Backlogs</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="sidebar">

<h2>Campus360</h2>

<ul>

<li><a href="/student_dashboard">Dashboard</a></li>

<li><a href="/backlogs">Backlogs</a></li>

<li><a href="/change_password">
<i class="fa-solid fa-key"></i> Change Password
</a></li>

<li><a href="/logout">Logout</a></li>

</ul>

</div>

<div class="main">

<h2>Backlog Subjects</h2>

<table>

<tr>

<th>Subject</th>

<th>Status</th>

</tr>

{% for row in backlogs %}

<tr>

<td>{{ row['subject'] }}</td>

<td>{{ row['status'] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
