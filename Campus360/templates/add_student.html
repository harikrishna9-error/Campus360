<!DOCTYPE html>
<html>

<head>

<title>Add Student</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main">

<div class="form-box">

<h2>Add Student</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}

<div class="alert alert-{{ category }}">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form action="/add_student" method="POST">

<input
type="text"
name="rollno"
placeholder="Roll Number"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<input
type="text"
name="name"
placeholder="Student Name"
required>

<input
type="text"
name="branch"
placeholder="Branch"
required>

<input
type="text"
name="year"
placeholder="Year"
required>

<input
type="text"
name="section"
placeholder="Section"
required>

<input
type="text"
name="phone"
placeholder="Phone Number">

<input
type="email"
name="email"
placeholder="Email">

<input
type="text"
name="address"
placeholder="Address">

<input
type="date"
name="dob">

<input
type="text"
name="bloodgroup"
placeholder="Blood Group">

<br><br>

<button
type="submit"
class="btn btn-success">

Add Student

</button>

</form>

</div>

</div>

</body>

</html>
