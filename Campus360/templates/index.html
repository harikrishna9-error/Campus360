<!DOCTYPE html>
<html>
<head>
<title>Student Search</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    text-align:center;
    padding-top:100px;
}

.box{
    width:350px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

input{
    width:90%;
    padding:10px;
}

button{
    padding:10px 20px;
    margin-top:10px;
    background:blue;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="box">

<h2>Student Search System</h2>

<form action="/search" method="POST">

<input type="number" name="rollno" placeholder="Enter Roll Number">

<br><br>

<button type="submit">Search</button>

</form>

</div>

</body>
</html>
