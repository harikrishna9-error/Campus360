<!DOCTYPE html>
<html>

<head>

<title>Exam Details</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="sidebar">

<h2>Campus360</h2>

<ul>

<li><a href="/student_dashboard">Dashboard</a></li>

<li><a href="/exam_details">Exam Details</a></li>

<li><a href="/logout">Logout</a></li>

</ul>

</div>

<div class="main">

<h2>Upcoming Examinations</h2>

<table>

<tr>

<th>Exam</th>

<th>Date</th>

<th>Branch</th>

<th>Year</th>

</tr>

{% for exam in exams %}

<tr>

<td>{{ exam['exam_name'] }}</td>

<td>{{ exam['exam_date'] }}</td>

<td>{{ exam['branch'] }}</td>

<td>{{ exam['year'] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
