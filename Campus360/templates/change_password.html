<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main">

<div class="form-box">

<h2>Change Password</h2>

<form action="/change_password" method="POST"></form>

<input
type="password"
name="old_password"
placeholder="Old Password"
required>

<input
type="password"
name="new_password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button type="submit" class="btn btn-success">
Update Password
</button>

</form>

</div>

</div>

</body>

</html>
