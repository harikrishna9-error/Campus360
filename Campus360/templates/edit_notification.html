<!DOCTYPE html>
<html>

<head>

<title>Edit Notification</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main">

<div class="form-box">

<h2>Edit Notification</h2>

<form method="POST">

<input
type="text"
name="title"
value="{{ notification['title'] }}"
required>

<textarea
name="message"
required>{{ notification['message'] }}</textarea>

<input
type="date"
name="date"
value="{{ notification['date'] }}"
required>

<button
class="btn btn-success">

Update Notification

</button>

<a href="/notifications"
class="btn"
style="margin-left:15px;">

Cancel

</a>

</form>

</div>

</div>

</body>

</html>
