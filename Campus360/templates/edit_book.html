<!DOCTYPE html>
<html>

<head>

<title>Edit Book</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="main">

<div class="form-box">

<h2>Edit Book</h2>

<form action="/edit_book/{{ book['id'] }}" method="POST">

<input
type="text"
name="book_name"
value="{{ book['book_name'] }}"
required>

<input
type="text"
name="author"
value="{{ book['author'] }}"
required>

<input
type="number"
name="quantity"
value="{{ book['quantity'] }}"
required>

<button type="submit" class="btn btn-success">
    Update Book
</button>

</form>

</div>

</div>

</body>

</html>
