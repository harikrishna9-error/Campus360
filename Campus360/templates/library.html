<!DOCTYPE html>
<html>
<head>

<title>Library</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="sidebar">

<h2>Campus360</h2>

<ul>

<li><a href="/student_dashboard">Dashboard</a></li>

<li><a href="/library">Library</a></li>

<li><a href="/change_password">
<i class="fa-solid fa-key"></i> Change Password
</a></li>

<li><a href="/logout">Logout</a></li>

</ul>

</div>

<div class="main">

<h2>Issued Books</h2>

<table>

<tr>

<th>Book Name</th>

<th>Issue Date</th>

<th>Return Date</th>

<th>Status</th>

</tr>

{% for book in books %}

<tr>

<td>{{ book['book_name'] }}</td>

<td>{{ book['issue_date'] }}</td>

<td>{{ book['return_date'] }}</td>

<td>{{ book['status'] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
